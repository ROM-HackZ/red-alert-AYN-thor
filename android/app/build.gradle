plugins { id 'com.android.application' }
android {
    namespace 'org.redalertthor.app'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig { applicationId 'org.redalertthor.app'; minSdk 24; targetSdk 32; versionCode 2; versionName '0.1.0-dev.2'; ndk { abiFilters 'arm64-v8a' } }
    sourceSets.main.java.srcDirs += ['build/generated/sdl']
    sourceSets.main.assets.srcDirs += ['build/generated/licenses']
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
