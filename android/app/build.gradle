plugins { id 'com.android.application' }
android {
    namespace 'org.redalertthor.app'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig { applicationId 'org.redalertthor.app'; minSdk 24; targetSdk 33; versionCode 4; versionName '0.1.0-dev.4'; ndk { abiFilters 'arm64-v8a' } }
    signingConfigs {
        release {
            if (System.getenv('THOR_SIGNING_STORE')) {
                storeFile file(System.getenv('THOR_SIGNING_STORE'))
                storePassword System.getenv('THOR_SIGNING_PASSWORD')
                keyAlias System.getenv('THOR_SIGNING_ALIAS')
                keyPassword System.getenv('THOR_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    sourceSets.main.java.srcDirs += ['build/generated/sdl']
    sourceSets.main.assets.srcDirs += ['build/generated/licenses']
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
